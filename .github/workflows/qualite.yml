name: Qualité de la documentation

on:
  push:
  gollum:
  workflow_dispatch:

jobs:
  syntaxe:
    name: Syntaxe Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le contenu du dépôt
        uses: actions/checkout@v7

      - name: Récupérer le wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Vérifier la syntaxe avec markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            _posts/*.md
            wiki/*.md

  liens:
    name: Liens
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le contenu du dépôt
        uses: actions/checkout@v7

      - name: Récupérer le wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Vérifier les liens avec lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments --exclude-loopback --fallback-extensions md README.md "wiki/*.md"
